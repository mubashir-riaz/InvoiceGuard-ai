# docker-compose.yml
# Defines all services for local development.

# version: "3.9"

services:
  # PostgreSQL database (empty in for now)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: InvoiceGuard-ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis message broker for ARQ worker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # FastAPI backend (serves REST API)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app # hot reload
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/InvoiceGuard-ai
      REDIS_URL: redis://redis:6379/0
      PROJECT_NAME: InvoiceGuard-ai
    depends_on:
      - db
      - redis

  # ARQ background task worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: arq worker_app.main.WorkerSettings --watch
    volumes:
      - ./worker/tasks:/app/tasks # hot reload
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/InvoiceGuard-ai
    depends_on:
      - redis
      - db

  # React Vite frontend (dev server with HMR)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host
    ports:
      - "3000:5173" # Vite default port mapped to 3000 on host
    volumes:
      - ./frontend/src:/app/src # hot reload
      - ./frontend/public:/app/public
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
