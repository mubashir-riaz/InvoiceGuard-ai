# docker-compose.yml
# Phase 2: added uploads volume, UPLOAD_DIR env, OPENAI_API_KEY for worker.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: invoiceguard_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ./entrypoint.sh
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app # hot reload
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/invoiceguard_ai
      REDIS_URL: redis://redis:6379/0
      PROJECT_NAME: invoiceguard-ai
      UPLOAD_DIR: /app/uploads
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: arq worker_app.main.WorkerSettings --watch
    volumes:
      - ./worker/tasks:/app/tasks # hot reload
      - uploads_data:/app/uploads # share PDFs
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/invoiceguard_ai
      LLM_PROVIDER: ${LLM_PROVIDER} # "groq" or "gemini"
      GROQ_API_KEY: ${GROQ_API_KEY} # from .env
      GEMINI_API_KEY: ${GEMINI_API_KEY} # from .env
      UPLOAD_DIR: /app/uploads
    depends_on:
      - redis
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
  uploads_data:
